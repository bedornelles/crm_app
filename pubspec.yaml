name: crm_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  dio: ^5.9.0
  flutter_modular: ^6.4.1
  mobx: ^2.5.0
  flutter_mobx: ^2.3.0
  uuid: ^4.5.1
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  sqlite3_flutter_libs: ^0.5.39
  shared_preferences: ^2.5.3
  synchronized: ^3.4.0
  path: ^1.9.1
  path_provider: ^2.1.5
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  date_field: ^3.0.0
  brasil_fields: ^1.19.0
  flutter_typeahead: ^5.2.0
  pkg_flutter_utils:
    git:
      url: git@github.com:dev-cervantes/pkg_flutter_utils.git
      ref: v2.8
  signalr_netcore: ^1.4.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mobx_codegen: ^2.7.2
  build_runner: ^2.6.1
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  intl: 0.19.0

flutter:
  uses-material-design: true
  assets:
    - assets\images\app_icon_grande.png

fonts:
  - family: PlusJakartaSans
    fonts:
      - asset: assets/fonts/PlusJakartaSans-Bold.ttf
        weight: 700
      - asset: assets/fonts/PlusJakartaSans-BoldItalic.ttf
        weight: 700
      - asset: assets/fonts/PlusJakartaSans-Italic.ttf
        weight: 400
      - asset: assets/fonts/PlusJakartaSans-Medium.ttf
        weight: 500
      - asset: assets/fonts/PlusJakartaSans-MediumItalic.ttf
        weight: 500
      - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        weight: 400

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon_grande.png"